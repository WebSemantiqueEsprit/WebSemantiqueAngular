<div class="behavior-patterns" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  <h2>Behavior Patterns</h2>

  <!-- Add New Behavior Pattern Form -->
  <section class="form-section">
    <h3>Add New Behavior Pattern</h3>
    <div class="form-group">
      <label for="newBehaviorPatternName">Behavior Pattern Name:</label>
      <input id="newBehaviorPatternName" [(ngModel)]="newPattern.behaviorPatternName" placeholder="Behavior Pattern Name" />
    </div>
    <div class="form-group">
      <label for="newUsagePattern">Usage Pattern:</label>
      <input id="newUsagePattern" [(ngModel)]="newPattern.hasUsagePattern" placeholder="Usage Pattern" />
    </div>
    <div class="form-group">
      <label for="newReductionPotential">Reduction Potential:</label>
      <input id="newReductionPotential" type="number" [(ngModel)]="newPattern.hasReductionPotential" placeholder="Reduction Potential" />
    </div>
    <button class="btn-add" (click)="addBehaviorPattern()">Add Behavior Pattern</button>
  </section>

  <!-- Update Selected Behavior Pattern Form -->
  <section class="form-section" *ngIf="updatedPattern.behaviorPatternName">
    <h3>Edit Behavior Pattern</h3>
    <div class="form-group">
      <label for="editBehaviorPatternName">Behavior Pattern Name:</label>
      <input id="editBehaviorPatternName" [(ngModel)]="updatedPattern.behaviorPatternName" placeholder="Behavior Pattern Name" disabled />
    </div>
    <div class="form-group">
      <label for="editUsagePattern">Usage Pattern:</label>
      <input id="editUsagePattern" [(ngModel)]="updatedPattern.hasUsagePattern" placeholder="Usage Pattern" />
    </div>
    <div class="form-group">
      <label for="editReductionPotential">Reduction Potential:</label>
      <input id="editReductionPotential" type="number" [(ngModel)]="updatedPattern.hasReductionPotential" placeholder="Reduction Potential" />
    </div>
    <button class="btn-update" (click)="updateBehaviorPattern(updatedPattern)">Update Behavior Pattern</button>
    <button class="btn-cancel" (click)="updatedPattern = {}">Cancel</button>
  </section>

  <!-- Behavior Patterns List -->
  <section>
    <h3>Behavior Patterns List</h3>
    <table class="behavior-pattern-table">
      <thead>
      <tr>
        <th>Behavior Pattern Name</th>
        <th>Usage Pattern</th>
        <th>Reduction Potential</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let pattern of behaviorPatterns">
        <td>{{ pattern.behaviorPatternName }}</td>
        <td>{{ pattern.hasUsagePattern }}</td>
        <td>{{ pattern.hasReductionPotential }}</td>
        <td>
          <button class="btn-edit" (click)="editBehaviorPattern(pattern)">Edit</button>
          <button class="btn-delete" (click)="deleteBehaviorPattern(pattern.behaviorPatternName)">Delete</button>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</div>

<style>
  .behavior-patterns {
    background-color: #f9f9f9;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  .form-section {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  button {
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn-add {
    background-color: #4CAF50; /* Green */
  }

  .btn-update {
    background-color: #2196F3; /* Blue */
  }

  .btn-cancel {
    background-color: #f44336; /* Red */
  }

  .btn-edit {
    background-color: #FFC107; /* Yellow */
  }

  .btn-delete {
    background-color: #f44336; /* Red */
  }

  .behavior-pattern-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  .behavior-pattern-table th,
  .behavior-pattern-table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }

  .behavior-pattern-table th {
    background-color: #f1f1f1;
    font-weight: bold;
  }

  .behavior-pattern-table tr:hover {
    background-color: #f9f9f9;
  }
</style>

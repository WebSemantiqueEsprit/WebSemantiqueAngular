<div class="container mx-auto mt-12 px-5">

  <!-- Titre et description -->
  <h3 class="text-4xl font-bold mb-4 text-center text-gray-800">
      Liste des Dispositifs
  </h3>

  <div class="text-center mb-8">
    <button (click)="addDevice()"
        class="bg-blue-600 text-white rounded-full mx-auto px-4 py-2 shadow-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-300 transform hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>Ajouter un Appareil</span>
    </button>
</div>
  <!-- Bouton pour ajouter un nouvel appareil -->
   <!-- Formulaire de filtrage par plage de puissance -->
<!-- Formulaire de filtrage par plage de puissance -->
<div class="flex justify-center mb-10 space-x-4">
  <input type="text" [(ngModel)]="minPowerRating" (ngModelChange)="onMinPowerRatingChange()" 
         placeholder="Puissance min" 
         class="border border-gray-300 rounded-l-md p-3 w-full max-w-xs focus:outline-none" />
  <input type="text" [(ngModel)]="maxPowerRating" (ngModelChange)="onMaxPowerRatingChange()" 
         placeholder="Puissance max" 
         class="border border-gray-300 p-3 w-full max-w-xs focus:outline-none" />
</div>
  
  <!-- Barre de recherche -->
 <!-- Barre de recherche -->
 <div class="flex justify-center mb-10">
  <div class="flex w-full max-w-md">
    <input type="text" [(ngModel)]="searchValue" (ngModelChange)="onSearchChange($event)" 
           placeholder="Rechercher par power rating"
           class="border border-gray-300 rounded-l-md p-3 w-full focus:outline-none">
  </div>
</div>



  <!-- Liste des appareils -->
  <div *ngIf="displayedDevices.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let device of displayedDevices"
          class="bg-white shadow-lg rounded-lg p-6 transition-transform transform hover:scale-105 text-center">
          <p class="font-semibold text-lg mb-2 text-gray-800">{{ device.deviceName }}</p>
          <p class="text-gray-600"><strong>Puissance:</strong> {{ device.powerRating }} W</p>
          <p class="text-gray-600"><strong>Fréquence d'utilisation:</strong> {{ device.usageFrequency }}</p>

          <!-- Boutons d'action -->
          <div class="mt-4 flex justify-center space-x-3">
              <button (click)="updateDevice(device)"
                  class="border border-green-500 text-green-500 hover:bg-green-500 hover:text-white rounded-full p-2 transition duration-300">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5l3 3m0 0l-12 12H4v-4L16 5z" />
                  </svg>
              </button>

              <button (click)="deleteDevice(device)"
                  class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white rounded-full p-2 transition duration-300">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
              </button>
          </div>
      </div>
  </div>

  <!-- Message si aucun appareil n'est trouvé -->
  <div *ngIf="displayedDevices.length === 0" class="text-center mt-10">
      <p class="text-gray-500 text-lg">Aucun appareil trouvé.</p>
  </div>

  <!-- Modal pour ajout/modification d'appareil -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-lg mx-4 transition-shadow duration-300">
          <h2 class="text-2xl font-bold mb-6 text-gray-800">
              {{ editDevice ? 'Modifier l\'appareil' : 'Ajouter un nouvel appareil' }}
          </h2>
          <form (ngSubmit)="editDevice ? submitUpdatedDevice() : submitNewDevice()">
              <div class="mb-5">
                  <label class="block text-gray-700 mb-2">Nom de l'appareil:</label>
                  <input type="text" [(ngModel)]="newDevice.deviceName" name="deviceName" required
                      class="border border-gray-300 rounded-md p-3 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  <p *ngIf="invalidDeviceName" class="text-red-500 text-sm mt-1">Le nom de l'appareil est requis.</p>
              </div>
              <div class="mb-5">
                  <label class="block text-gray-700 mb-2">Puissance (W):</label>
                  <input type="text" [(ngModel)]="newDevice.powerRating" name="powerRating" required
                      class="border border-gray-300 rounded-md p-3 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div class="mb-5">
                  <label class="block text-gray-700 mb-2">Fréquence d'utilisation:</label>
                  <input type="text" [(ngModel)]="newDevice.usageFrequency" name="usageFrequency" required
                      class="border border-gray-300 rounded-md p-3 w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div class="flex justify-end">
                  <button type="button" (click)="closeModal()" class="bg-gray-300 text-gray-700 rounded-md px-4 py-2 mr-3">
                      Annuler
                  </button>
                  <button type="submit" class="bg-blue-600 text-white rounded-md px-4 py-2">
                      {{ editDevice ? 'Modifier' : 'Ajouter' }}
                  </button>
              </div>
          </form>
      </div>
  </div>
</div>

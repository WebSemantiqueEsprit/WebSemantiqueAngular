<div class="container mx-auto px-4">


<!-- Search Section -->
<div class="text-end mb-6">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Nom du contrat"
    class="border border-gray-300 rounded-full p-2 shadow-sm focus:ring focus:ring-blue-300"
  />
  <input
    type="number"
    [(ngModel)]="minCost"
    placeholder="Coût minimum"
    class="border border-gray-300 rounded-full p-2 shadow-sm focus:ring focus:ring-blue-300 ml-2"
  />
  <input
    type="number"
    [(ngModel)]="maxCost"
    placeholder="Coût maximum"
    class="border border-gray-300 rounded-full p-2 shadow-sm focus:ring focus:ring-blue-300 ml-2"
  />
  <input
    type="text"
    [(ngModel)]="duration"
    placeholder="Durée"
    class="border border-gray-300 rounded-full p-2 shadow-sm focus:ring focus:ring-blue-300 ml-2"
  />
  <button
    (click)="searchContracts()"
    class="bg-blue-600 text-white rounded-full px-6 py-2 hover:bg-blue-700 shadow-md transition duration-200 ml-2"
  >
    Rechercher
  </button>
</div>
  <!-- Button to add a new contract -->
  <div class="text-start mb-6 ml-9">
    <button (click)="openAddModal()"
      class="bg-green-500 text-white rounded-full px-6 py-2 hover:bg-green-600 shadow-md transition duration-200">
      Ajouter un nouveau contrat
    </button>
  </div>


  <!-- Contract Definition -->
  <h3 class="text-4xl font-bold mb-6 text-start text-blue-700 ml-9">Contrats</h3>
  <p class="text-lg text-gray-600 mb-8 text-start ml-9">
    Gérer les contrats de manière efficace.
  </p>



  <!-- List of contracts -->
  <div *ngIf="contracts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 ml-9">
    <div *ngFor="let contract of contracts"
      class="bg-white shadow-lg rounded-lg p-6 hover:shadow-xl transition-shadow duration-300 text-center border border-gray-200">
      <p class="text-lg font-semibold text-gray-700"><strong>Nom du contrat:</strong> {{ contract.contractName }}</p>
      <p class="text-gray-600"><strong>Coût:</strong> {{ contract.hasCostContract }}</p>
      <p class="text-gray-600"><strong>Durée:</strong> {{ contract.hasDuration }}</p>

      <!-- Buttons to update or delete -->
      <div class="mt-4 flex justify-center space-x-4">
        <!-- Edit Button (green) -->
        <button (click)="openEditModal(contract)"
          class="border border-green-500 text-green-500 hover:bg-green-500 hover:text-white rounded-full px-4 py-2 shadow-md transition duration-200">
          Modifier
        </button>

        <!-- Delete Button (red) -->
        <button (click)="deleteContract(contract.contractName)"
          class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white rounded-full px-4 py-2 shadow-md transition duration-200">
          Supprimer
        </button>
      </div>
    </div>
  </div>

  <!-- Message if no contracts are found -->
  <div *ngIf="contracts.length === 0" class="text-center">
    <p class="text-gray-500 text-xl">Aucun contrat trouvé.</p>
  </div>

  <!-- Modal for adding/updating contracts -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-lg p-6 w-96 transform transition-transform duration-300 scale-95 hover:scale-100 text-start">
      <h2 class="text-2xl font-bold mb-4 text-blue-700">{{ isEditing ? 'Modifier le contrat' : 'Ajouter un nouveau contrat' }}</h2>
      <form (ngSubmit)="onSubmit()">
        <div *ngIf="!isEditing" class="mb-4">
          <label class="block text-gray-700 mb-1">Nom du contrat:</label>
          <input type="text" [(ngModel)]="newContract.contractName" name="contractName" required
            class="border border-gray-300 rounded-lg p-2 w-full shadow-sm focus:ring focus:ring-blue-300" />
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Coût:</label>
          <input type="number" [(ngModel)]="newContract.hasCostContract" name="cost" required
            class="border border-gray-300 rounded-lg p-2 w-full shadow-sm focus:ring focus:ring-blue-300" />
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">Durée:</label>
          <input type="text" [(ngModel)]="newContract.hasDuration" name="duration" required
            class="border border-gray-300 rounded-lg p-2 w-full shadow-sm focus:ring focus:ring-blue-300" />
        </div>
        <div class="flex justify-between">
          <button type="submit"
            class="bg-blue-500 text-white rounded-full px-4 py-2 hover:bg-blue-600 shadow-md transition duration-200">
            {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
          </button>
          <button (click)="closeModal()" type="button"
            class="border border-gray-500 text-gray-500 hover:bg-gray-500 hover:text-white rounded-full px-4 py-2 shadow-md transition duration-200">
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="container mt-20">

    <!-- Contract Definition -->
    <h3 class="text-3xl font-bold mb-6 text-center">Contrats</h3>
    <p class="text-lg text-gray-600 mb-8 text-center">
        Gérer les contrats de manière efficace.
    </p>

    <!-- Button to add a new contract -->
    <div class="text-center mb-6">
        <button (click)="openAddModal()"
            class="bg-blue-500 text-white rounded-md px-6 py-2 hover:bg-blue-600 transition duration-200">
            Ajouter un nouveau contrat
        </button>
    </div>

    <!-- List of contracts -->
    <div *ngIf="contracts.length > 0">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div *ngFor="let contract of contracts"
                class="bg-white shadow-lg rounded-lg p-6 hover:shadow-xl transition-shadow duration-300 text-center">
                <p><strong>Nom du contrat :</strong> {{ contract.contractName }}</p>
                <p><strong>Coût :</strong> {{ contract.hasCostContract }}</p>
                <p><strong>Durée :</strong> {{ contract.hasDuration }}</p>

                <!-- Buttons to update or delete -->
                <div class="mt-4 flex justify-center space-x-4">
                    <!-- Edit Button (green) -->
                    <button (click)="openEditModal(contract)"
                        class="border border-green-500 text-green-500 hover:bg-green-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
                        Modifier
                    </button>

                    <!-- Delete Button (red) -->
                    <button (click)="deleteContract(contract.contractName)"
                        class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
                        Supprimer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Message if no contracts are found -->
    <div *ngIf="contracts.length === 0" class="text-center">
        <p class="text-gray-500">Aucun contrat trouvé.</p>
    </div>

    <!-- Modal for adding/updating contracts -->
    <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white shadow-lg rounded-lg p-6 w-96 md:w-96 hover:shadow-xl transition-shadow duration-300 text-start">
            <h2 class="text-xl font-bold mb-4">{{ isEditing ? 'Modifier le contrat' : 'Ajouter un nouveau contrat' }}</h2>
            <form (ngSubmit)="onSubmit()">
              <div *ngIf="!isEditing" class="mb-4">
                <label class="block mb-1">Nom du contrat:</label>
                <input type="text" [(ngModel)]="newContract.contractName" name="contractName" required
                    class="border border-gray-300 rounded-md p-2 w-full" />
            </div>

                <div class="mb-4">
                    <label class="block mb-1">Coût:</label>
                    <input type="number" [(ngModel)]="newContract.hasCostContract" name="cost" required
                        class="border border-gray-300 rounded-md p-2 w-full" />
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Durée:</label>
                    <input type="text" [(ngModel)]="newContract.hasDuration" name="duration" required
                        class="border border-gray-300 rounded-md p-2 w-full" />
                </div>
                <div class="flex justify-between">
                    <button type="submit"
                        class="bg-blue-500 text-white rounded-md px-4 py-2 hover:bg-blue-600 transition duration-200">
                        {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
                    </button>
                    <button (click)="closeModal()" type="button"
                        class="border border-gray-500 text-gray-500 hover:bg-gray-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
                        Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>
  </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Sidebar Example</title>
</head>
<body class="bg-gray-100 dark:bg-gray-900">

    <!-- Button to open/close sidebar -->
    <button id="toggle-sidebar" aria-controls="default-sidebar"
        type="button"
        class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600">
        <span class="sr-only">Toggle sidebar</span>
        <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
        </svg>
    </button>

    <!-- Sidebar -->
    <aside id="default-sidebar"
        class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform transform -translate-x-full sm:translate-x-0"
        aria-label="Sidebar">
        <div class="h-full px-3 py-4 overflow-y-auto bg-gray-50 dark:bg-gray-800">
            <ul class="space-y-2 font-medium" id="sidebar-menu">
                <li>
                    <a routerLink="/back/dashboard" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                        <svg class="w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 22 21">
                            <path d="M16.975 11H10V4.025a1 1 0 0 0-1.066-.998 8.5 8.5 0 1 0 9.039 9.039.999.999 0 0 0-1-1.066h.002Z" />
                            <path d="M12.5 0c-.157 0-.311.01-.565.027A1 1 0 0 0 11 1.02V10h8.975a1 1 0 0 0 1-.935c.013-.188.028-.374.028-.565A8.51 8.51 0 0 0 12.5 0Z" />
                        </svg>
                        <span class="ms-3">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a routerLink="carbonfootprint/listCarbone" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                        <svg class="flex-shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 3.27 2.32 6.32 5.39 7.55C9.02 18.42 7 21 7 21h10s-2.02-2.58-3.39-4.45C16.68 15.32 19 12.27 19 9c0-3.87-3.13-7-7-7zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z" />
                        </svg>
                        <span class="flex-1 ms-3 whitespace-nowrap">Empreinte Carbone</span>
                    </a>
                </li>
                <li>
                  <a routerLink="cabonreductionstrategy/listCarboneReduction" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
                      <svg class="flex-shrink-0 w-5 h-5 text-gray-500 transition duration-75 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"
                          aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M12 2C10.34 2 8.76 2.76 7.75 4.25L5.56 6.44C4.64 7.36 4 8.84 4 10.5V12c0 1.66.64 3.14 1.56 4.06l1.38 1.38C8.25 19.44 10.08 21 12 21c1.92 0 3.75-1.56 4.06-1.88l1.38-1.38C19.36 15.14 20 13.66 20 12v-1.5c0-1.66-.64-3.14-1.56-4.06L16.25 4.25C15.24 2.76 13.66 2 12 2zM12 19c-1.04 0-2.08-.29-3-1l-1.25-1.25C7.08 16.78 6.5 15.45 6.5 14H17.5c0 1.45-.58 2.78-1.25 3.75L15 18c-.92.71-1.96 1-3 1zm4.24-4H7.76c.11-.54.29-1.07.53-1.56l1.25 1.25c.2.2.46.32.75.32h7.24c.29 0 .55-.12.75-.32l1.25-1.25c.24.49.42 1.02.53 1.56zm0-5H7.76c.11-.54.29-1.07.53-1.56l1.25 1.25c.2.2.46.32.75.32h7.24c.29 0 .55-.12.75-.32l1.25-1.25c.24.49.42 1.02.53 1.56z"/>
                      </svg>
                      <span class="flex-1 ms-3 whitespace-nowrap">Stratégies de Réduction</span>
                  </a>
              </li>
            </ul>
        </div>
    </aside>

    <script>
        // Script for sidebar toggle functionality
        const button = document.getElementById('toggle-sidebar');
        const sidebar = document.getElementById('default-sidebar');

        button.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full'); // Toggle the translate class
        });

        // Function to activate the link based on the current route
        function activateLink() {
         console.log()
            const links = document.querySelectorAll('#sidebar-menu a');
            const currentPath = window.location.pathname; // Get the current path

            links.forEach(link => {
                const linkPath = link.getAttribute('routerLink'); // Get the routerLink attribute

                // Compare and set the active link
                if (currentPath.includes(linkPath)) {
                    link.classList.add('bg-gray-200', 'text-blue-600'); // Add active class
                } else {
                    link.classList.remove('bg-gray-200', 'text-blue-600'); // Remove active class
                }
            });
        }

        // Call activateLink function on page load
        window.addEventListener('load', activateLink);
    </script>

</body>
</html>

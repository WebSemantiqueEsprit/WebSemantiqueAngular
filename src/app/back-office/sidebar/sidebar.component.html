<head>

<body class="bg-gray-100 dark:bg-gray-900">

    <!-- Button to open/close sidebar -->

        type="button"

        <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">

        </svg>
    </button>

    <script>
        // Script for sidebar toggle functionality
        const button = document.getElementById('toggle-sidebar');
        const sidebar = document.getElementById('default-sidebar');

        button.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full'); // Toggle the translate class
        });

        // Function to activate the link based on the current route
        function activateLink() {
         console.log()
            const links = document.querySelectorAll('#sidebar-menu a');
            const currentPath = window.location.pathname; // Get the current path

            links.forEach(link => {
                const linkPath = link.getAttribute('routerLink'); // Get the routerLink attribute

                // Compare and set the active link
                if (currentPath.includes(linkPath)) {
                    link.classList.add('bg-gray-200', 'text-blue-600'); // Add active class
                } else {
                    link.classList.remove('bg-gray-200', 'text-blue-600'); // Remove active class
                }
            });
        }

        // Call activateLink function on page load
        window.addEventListener('load', activateLink);
    </script>

</body>
</html>

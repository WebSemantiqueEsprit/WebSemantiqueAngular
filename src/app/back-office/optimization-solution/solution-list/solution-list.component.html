<div class="container mt-20">
  <!-- Title -->
  <h2 class="text-3xl font-bold mb-6 text-center">Optimization Solutions</h2>

  <!-- Search and Filter Section -->
  <div class="flex justify-between mb-4">
    <div class="flex space-x-4">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (input)="filterSolutions()"
        placeholder="Search by Solution Name"
        class="border border-gray-300 rounded-md p-2"
      />
      <select [(ngModel)]="filterCriterion" (change)="filterSolutions()" class="border border-gray-300 rounded-md p-2">
        <option value="">All</option>
        <option value="low-cost">Low Cost</option>
        <option value="high-cost">High Cost</option>
      </select>

      <!-- Cost Range Filter -->
      <div>
        <input
          type="number"
          [(ngModel)]="minCost"
          (input)="filterSolutions()"
          placeholder="Min Cost"
          class="border border-gray-300 rounded-md p-2"
        />
        <input
          type="number"
          [(ngModel)]="maxCost"
          (input)="filterSolutions()"
          placeholder="Max Cost"
          class="border border-gray-300 rounded-md p-2"
        />
      </div>

      <!-- Cost Savings Range Filter -->
      <div>
        <input
          type="number"
          [(ngModel)]="minSavings"
          (input)="filterSolutions()"
          placeholder="Min Savings"
          class="border border-gray-300 rounded-md p-2"
        />
        <input
          type="number"
          [(ngModel)]="maxSavings"
          (input)="filterSolutions()"
          placeholder="Max Savings"
          class="border border-gray-300 rounded-md p-2"
        />
      </div>
    </div>

    <!-- Button to Add New Optimization Solution -->
    <div class="text-center">
      <button (click)="openModal()" class="bg-blue-500 text-white rounded-md px-6 py-2 hover:bg-blue-600 transition duration-200">
        Add Optimization Solution
      </button>
    </div>
  </div>

  <!-- List of Optimization Solutions -->
  <div *ngIf="optimizationSolutions.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let solution of filteredSolutions" class="bg-white shadow-lg rounded-lg p-6 hover:shadow-xl transition-shadow duration-300 text-center">
      <p><strong>Solution Name:</strong> {{ solution.solutionName }}</p>
      <p><strong>Implementation Cost:</strong> {{ solution.implementationCost }} TND</p>
      <p><strong>Cost Savings:</strong> {{ solution.costSavings }} TND</p>

      <!-- Edit and Delete Buttons -->
      <div class="mt-4 flex justify-center space-x-4">
        <button (click)="openModal(solution)" class="border border-green-500 text-green-500 hover:bg-green-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
          Edit
        </button>
        <button (click)="deleteOptimizationSolution(solution.solutionName)" class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Message if No Optimization Solutions Found -->
  <div *ngIf="filteredSolutions.length === 0" class="text-center">
    <p class="text-gray-500">No optimization solutions found.</p>
  </div>

  <!-- Modal for Adding/Updating Optimization Solutions -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-lg p-6 w-96 md:w-96 hover:shadow-xl transition-shadow duration-300">
      <h3 class="text-xl font-bold mb-4">{{ editOptimizationSolution ? 'Edit Optimization Solution' : 'Add Optimization Solution' }}</h3>
      <form (ngSubmit)="submitOptimizationSolution()">
        <div class="mb-4">
          <label class="block mb-1">Solution Name:</label>
          <input type="text" [(ngModel)]="newOptimizationSolution.solutionName" name="solutionName" required class="border border-gray-300 rounded-md p-2 w-full" />
        </div>
        <div class="mb-4">
          <label class="block mb-1">Implementation Cost:</label>
          <input type="number" [(ngModel)]="newOptimizationSolution.implementationCost" name="implementationCost" required class="border border-gray-300 rounded-md p-2 w-full" />
        </div>
        <div class="mb-4">
          <label class="block mb-1">Cost Savings:</label>
          <input type="number" [(ngModel)]="newOptimizationSolution.costSavings" name="costSavings" required class="border border-gray-300 rounded-md p-2 w-full" />
        </div>
        <div class="flex justify-between">
          <button type="submit" class="bg-blue-500 text-white rounded-md px-4 py-2 hover:bg-blue-600 transition duration-200">
            {{ editOptimizationSolution ? 'Update' : 'Add' }}
          </button>
          <button (click)="closeModal()" type="button" class="border border-gray-500 text-gray-500 hover:bg-gray-500 hover:text-white rounded-md px-4 py-2 transition duration-200">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
